# tasks/main.yml
# Install and configure QEMU Guest Agent for Proxmox VMs
---
- name: Setup QEMU Guest Agent
  when:
    - qemu_guest_agent_enabled | default(false) | bool
    - ansible_facts['virtualization_type'] is defined
    - ansible_facts['virtualization_type'] in ['kvm', 'qemu']
    - ansible_facts['os_family'] in ['Debian', 'RedHat']
  block:
    - name: Install qemu-guest-agent package
      ansible.builtin.package:
        name: qemu-guest-agent
        state: present

    - name: Ensure qemu-guest-agent is started and enabled
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true